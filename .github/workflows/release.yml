name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Verify stable release tag and versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import runpy
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Expected a stable version"
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag/version mismatch"
          assert runpy.run_path("src/etrade_python/_version.py")["__version__"] == version
          lock = tomllib.loads(Path("uv.lock").read_text())
          assert next(p["version"] for p in lock["package"] if p["name"] == "etrade-python") == version
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest --cov-report=term-missing

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify wheel and source distribution outside checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sources = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sources) == 1, "Expected one wheel and one sdist"
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sources[0]) as archive:
              source_names = [n.partition("/")[2] for n in archive.getnames()]
          assert "etrade_python/py.typed" in wheel_names
          assert "src/etrade_python/py.typed" in source_names
          for name in wheel_names + source_names:
              parts = Path(name).parts
              assert not set(parts) & {"docs", ".venv", ".git", ".idea", "__pycache__", ".env"}, name
              assert not name.endswith((".pyc", ".pyo")), name

          for kind, artifact in (("wheel", wheels[0]), ("sdist", sources[0])):
              check_dir = Path(os.environ["RUNNER_TEMP"]) / f"{kind}-check"
              subprocess.run([sys.executable, "-m", "venv", str(check_dir)], check=True)
              python = str(check_dir / "bin/python")
              subprocess.run([python, "-m", "pip", "install", str(artifact.resolve())], check=True)
              subprocess.run([
                  python, "-c",
                  "import importlib.metadata, etrade_python; "
                  "assert etrade_python.__version__ == importlib.metadata.version('etrade-python') "
                  "== __import__('os').environ['RELEASE_TAG'][1:]",
              ], cwd=os.environ["RUNNER_TEMP"], check=True)
              result = subprocess.run(
                  [str(check_dir / "bin/etrade"), "--version"],
                  cwd=os.environ["RUNNER_TEMP"], check=True, capture_output=True, text=True,
              )
              assert result.stdout.strip() == os.environ["RELEASE_TAG"][1:]
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/etrade-python
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
