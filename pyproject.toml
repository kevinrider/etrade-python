[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "etrade-python"
version = "0.1.0.dev0"
description = "An unofficial, typed, async-first E*TRADE API client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "etrade-python contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.20,<1",
]

[project.scripts]
etrade = "etrade_python.cli.app:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
  "ruff>=0.11,<1", "pyright>=1.1.400,<2", "build>=1.2,<2", "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
# Keep artifacts compatible with Twine 6.x metadata validation.
core-metadata-version = "2.4"
packages = ["src/etrade_python"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/pyproject.toml", "/.env.example"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not sandbox and not production' --cov=etrade_python --cov-branch --cov-report=term-missing --cov-fail-under=90"
markers = ["sandbox: opt-in E*TRADE sandbox tests", "production: opt-in read-only production tests"]

[tool.coverage.run]
source = ["etrade_python"]
branch = true

[tool.coverage.report]
show_missing = true
